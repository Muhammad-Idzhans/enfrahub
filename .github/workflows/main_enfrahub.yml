name: Deploy Node.js app to Azure Web App - enfrahub

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "22.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: enfrahub-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: enfrahub-ui/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build Vite App
        run: npm run build

      - name: Deploy to OLD app (enfrasys tenant)
        uses: azure/webapps-deploy@v3
        continue-on-error: true
        with:
          app-name: enfrahub
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_AFC40D20E87F4D729E808FC7FC23A8DD }}
          package: enfrahub-ui

      - name: Deploy to NEW app (enfrasysdemos tenant)
        uses: azure/webapps-deploy@v3
        with:
          app-name: enfrahub-internal
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_ENFRAHUB_DEMO }}
          package: enfrahub-ui